name: Linux 패키지 릴리스

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "패키지 버전 (비우면 0.0.0.dev<커밋해시>로 붙습니다)"
        required: false
        type: string

permissions:
  contents: write

env:
  PACKAGE_NAME: rpt
  BINARY_NAME: rpt

jobs:
  package:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - goarch: amd64
            debarch: amd64
            rpmarch: x86_64
            archarch: x86_64
          - goarch: arm64
            debarch: arm64
            rpmarch: aarch64
            archarch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 패키징 도구 설치
        # libarchive-tools 는 fpm 의 pacman 타깃이 쓰는 bsdtar 를 제공한다.
        run: sudo apt-get update && sudo apt-get install -y ruby-dev rpm zstd libarchive-tools && sudo gem install fpm
      - name: 실행 파일 빌드
        run: |
          mkdir -p build release
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -trimpath -o build/${BINARY_NAME} .
      - name: DEB, RPM, Arch 패키지 생성
        env:
          # 입력값을 셸에 직접 펼치면 명령 주입이 되므로 환경 변수로 받는다.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
            # rpm과 pacman은 버전에 하이픈을 못 쓰므로 점으로만 이어 붙인다.
            [ -n "${VERSION}" ] || VERSION="0.0.0.dev$(echo "${GITHUB_SHA}" | cut -c1-7)"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "패키지 버전: ${VERSION}"
          # 첫 줄이 요약, 나머지가 상세 설명이 된다.
          DESCRIPTION=$(printf '%s\n' \
            "ROKFOSS 패키지 관리자" \
            "apt와 dpkg가 없는 시놀로지 DSM 등에서 ROKFOSS 저장소의 데비안" \
            "패키지를 설치하고 관리하는 도구입니다. 시스템 패키지 관리자의" \
            "목록과 상태를 건드리지 않고 자체 루트에서만 동작합니다.")
          # 관리자와 설명에 공백이 들어가므로 배열로 넘겨야 단어 분리로 깨지지 않는다.
          COMMON=(
            -s dir
            -n "${PACKAGE_NAME}"
            -v "${VERSION}"
            --iteration 1
            --license MIT
            --url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            --maintainer "ROKFOSS PROJECT <krfoss@krfoss.org>"
            --description "${DESCRIPTION}"
          )
          fpm "${COMMON[@]}" -t deb -a ${{ matrix.debarch }} -p "release/${PACKAGE_NAME}_${VERSION}-1_${{ matrix.debarch }}.deb" "build/${BINARY_NAME}=/usr/bin/${BINARY_NAME}"
          fpm "${COMMON[@]}" -t rpm -a ${{ matrix.rpmarch }} -p "release/${PACKAGE_NAME}-${VERSION}-1.${{ matrix.rpmarch }}.rpm" "build/${BINARY_NAME}=/usr/bin/${BINARY_NAME}"
          fpm "${COMMON[@]}" -t pacman -a ${{ matrix.archarch }} -p "release/${PACKAGE_NAME}-${VERSION}-1-${{ matrix.archarch }}.pkg.tar.zst" "build/${BINARY_NAME}=/usr/bin/${BINARY_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.goarch }}
          path: release/*

  release:
    needs: package
    # 태그를 밀었을 때, 그리고 수동 실행에서 버전을 넣었을 때 릴리스를 만든다.
    # 버전 없이 수동 실행하면 산출물만 만들고 릴리스는 건드리지 않는다.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release
          merge-multiple: true
      - name: 체크섬 및 GitHub 릴리스 생성
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          ARGS=(--repo "${GITHUB_REPOSITORY}" --generate-notes)
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # 태그 위에서 도는 것이 아니므로 태그 이름을 만들고 대상 커밋을 지정한다.
            TAG="v${INPUT_VERSION#v}"
            ARGS+=(--target "${GITHUB_SHA}")
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "릴리스 태그: ${TAG}"
          cd release
          sha256sum * > checksums.txt
          gh release create "${TAG}" * "${ARGS[@]}"
